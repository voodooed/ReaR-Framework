# Recommendation ITU-R P.2040-4 (09/2025), Table 3 -- "Effects of building
# materials and structures on radiowave propagation above about 100 MHz".
#
# THIS FILE IS THE DATABASE. No electromagnetic constant is hardcoded anywhere
# in rear/*.py; every value the framework uses is read from here (or from
# materials.yaml, for the four materials the Recommendation does not contain).
#
# THE MODEL, with frequency f in GHz:
#     eps_r'(f) = a * f^b          real relative permittivity
#     sigma(f)  = c * f^d          conductivity, S/m
# and everything else is derived (rear/materials/itu.py):
#     eps_r''   = sigma / (2 pi f eps_0)
#     Gamma_0   = (1 - sqrt(eps_c)) / (1 + sqrt(eps_c)),  eps_c = eps_r' - j eps_r''
#
# Cross-checked coefficient-by-coefficient against NVIDIA Sionna RT
# (sionna-rt/src/sionna/rt/radio_materials/itu.py), which is the reference
# implementation of the same table. CITE P.2040-4; Sionna is the cross-check.
#
# VALIDITY IS TRACKED, NOT ASSUMED. Each entry lists the frequency band(s) its
# coefficients were fitted over. VoD's ZF FRGen21 is a 77 GHz radar and P.2040's
# bands do not all cover it -- `evaluate()` returns in_band=False rather than
# silently extrapolating, and band selection uses LOG-frequency distance because
# these are power laws. Brick at 77 GHz falls in the genuine GAP between
# P.2040's 1-40 and 110-330 GHz campaigns; that is a real uncertainty and is
# flagged as medium confidence in materials.yaml, never smoothed over.
#
# To add a material: append an entry with its P.2040 band(s) and coefficients.
# To use it, reference the entry name from materials.yaml.

version: "P.2040-4 (09/2025), Table 3"
source: "Recommendation ITU-R P.2040-4, Table 3"
cross_check: "NVIDIA Sionna RT sionna/rt/radio_materials/itu.py"

# name: [[f_lo_GHz, f_hi_GHz, a, b, c, d], ...]
entries:
  vacuum:            [[0.001, 100.0,  1.0,   0.0,  0.0,     0.0]]
  concrete:          [[1.0,   100.0,  5.24,  0.0,  0.0462,  0.7822],
                      [110.0, 330.0,  5.17,  0.0,  0.0145,  1.0900]]
  brick:             [[1.0,   40.0,   3.91,  0.0,  0.0238,  0.16],
                      [110.0, 330.0,  4.15,  0.0,  0.0006,  1.5712]]
  plasterboard:      [[1.0,   100.0,  2.73,  0.0,  0.0085,  0.9395],
                      [110.0, 330.0,  2.56,  0.0,  0.0001,  1.7799]]
  wood:              [[0.001, 100.0,  1.99,  0.0,  0.0047,  1.0718],
                      [110.0, 330.0,  1.82,  0.0,  0.0040,  1.0761]]
  glass:             [[0.1,   100.0,  6.31,  0.0,  0.0036,  1.3394],
                      [220.0, 450.0,  5.79,  0.0,  0.0004,  1.658]]
  ceiling_board:     [[1.0,   100.0,  1.48,  0.0,  0.0011,  1.0750],
                      [220.0, 450.0,  1.52,  0.0,  0.0029,  1.029]]
  chipboard:         [[1.0,   100.0,  2.58,  0.0,  0.0217,  0.7800]]
  plywood:           [[1.0,   40.0,   2.71,  0.0,  0.33,    0.0]]
  marble:            [[1.0,   60.0,   7.074, 0.0,  0.0055,  0.9262],
                      [110.0, 330.0,  7.94,  0.0,  0.0001,  1.7330]]
  floorboard:        [[50.0,  100.0,  3.66,  0.0,  0.0044,  1.3515]]
  vinyl_tile:        [[1.0,   40.0,   3.62,  0.0,  0.0051,  0.8422]]
  carpet_tile:       [[1.0,   40.0,   2.08,  0.0,  0.0009,  0.8200]]
  asphalt_concrete:  [[1.0,   40.0,   4.83,  0.0,  0.0108,  1.3969]]
  metal:             [[1.0,   100.0,  1.0,   0.0,  1.0e7,   0.0]]
  very_dry_ground:   [[1.0,   10.0,   3.0,   0.0,  0.00015, 2.52]]
  medium_dry_ground: [[1.0,   10.0,  15.0,  -0.1,  0.035,   1.63]]
